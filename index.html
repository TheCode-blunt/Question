<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 💖</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 2;
        }

        h1 {
            font-size: 2.8rem;
            color: white;
            margin-bottom: 40px;
            text-shadow: 0px 4px 8px rgba(0,0,0,0.3);
        }

        .buttons {
            position: relative;
            height: 150px;
        }

        button {
            position: absolute;
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        #yesBtn {
            background: #ff4d6d;
            color: white;
            left: 40%;
        }

        #yesBtn:hover {
            transform: scale(1.1);
        }

        #noBtn {
            background: white;
            color: #ff4d6d;
            left: 55%;
        }

        .message {
            display: none;
            font-size: 2rem;
            color: white;
            margin-top: 30px;
        }

        .petal {
            position: fixed;
            top: -30px;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="romantic.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1>Will you be my Valentine, Riya? 💘</h1>

    <div class="buttons">
        <button id="yesBtn">Yes 🥰</button>
        <button id="noBtn">No 🥶</button>
    </div>

    <div class="message" id="message">
        💕 *Pad gayi na mere pyar me or kar message ka reply* 💕
    </div>
</div>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");
    const bgMusic = document.getElementById("bgMusic");

    // Play music on first click (browser requirement)
    document.body.addEventListener("click", () => {
        bgMusic.volume = 0.4;
        bgMusic.play();
    }, { once: true });

    noBtn.addEventListener("mouseover", evade);
    noBtn.addEventListener("click", evade);

    function evade() {
        const x = Math.random() * (window.innerWidth - 150);
        const y = Math.random() * (window.innerHeight - 150);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }

    yesBtn.addEventListener("click", () => {
        message.style.display = "block";
        startRain();
    });

    function startRain() {
        const interval = setInterval(createPetal, 250);
        setTimeout(() => clearInterval(interval), 8000);
    }

    function createPetal() {
        const petal = document.createElement("div");
        petal.className = "petal";

        // Randomly choose red heart or rose emoji
        petal.innerText = Math.random() < 0.5 ? "❤️" : "🌹";

        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDuration = (3 + Math.random() * 3) + "s";

        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 7000);
    }
</script>

</body>
</html>
